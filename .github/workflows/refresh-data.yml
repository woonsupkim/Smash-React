name: Refresh player stats

# Triggered three ways: daily on a schedule during grand slam windows (below,
# at 08:37 local time at whichever venue is playing),
# manually from the Home page's "Update Data" button (via
# api/trigger-refresh.js), or directly from the GitHub Actions tab. Runs the
# full data-pipeline refresh and commits the regenerated CSVs/h2h.json back
# to main, which triggers a Vercel redeploy. Doing this in a GitHub Action
# (rather than inside the Vercel serverless function) sidesteps Vercel's
# function execution time limits - a full refresh across ~50 players can
# take several minutes.
on:
  workflow_dispatch:
    inputs:
      send_digest:
        description: 'Mail the digest to subscribers (uncheck to build the files without sending)'
        type: boolean
        required: false
        default: true
  # 08:37 LOCAL AT THE VENUE, inside generous windows around each event.
  #
  # Two things fixed here, both of which had been silently costing runs.
  #
  # 1. The hour is now per venue, not one global 09:00 UTC. The refresh has to
  #    land in the gap between the previous night's last result posting and
  #    the day's first ball, and the four slams sit in four timezones - so a
  #    single UTC hour cannot serve them. 09:00 UTC was 8pm in Melbourne (the
  #    day's play already over, so nothing was "locked before play" at all)
  #    and 11am in Paris (exactly first ball). 08:00 local puts it about six
  #    hours after the last night-session result and three before first ball,
  #    with the day's order of play already published so start times arrive
  #    real instead of TBD.
  #
  # 2. The minute is :37, not :00. Every cron here fired on the hour, which is
  #    the most oversubscribed slot on GitHub's scheduler; scheduled runs are
  #    delayed or DROPPED under load, and a dropped run leaves no trace in the
  #    Actions log. Both this workflow and odds-snapshots (also on the hour)
  #    stopped firing entirely in late August. Off-the-hour is the documented
  #    mitigation.
  #
  # cron can't span month boundaries, so events that straddle one get two
  # entries. Dates are padded for year-to-year drift. Outside these windows
  # the refresh stays manual-only. Every window sits wholly inside its
  # venue's DST period, so the offsets below are constant within each.
  schedule:
    # Australian Open - Melbourne, AEDT (UTC+11). 08:37 local is 21:37 UTC the
    # PREVIOUS day, so these ranges are shifted back one from the local dates:
    # UTC Jan 7-31 covers local Jan 8 - Feb 1, and UTC Feb 1 covers local Feb 2.
    - cron: '37 21 7-31 1 *'   # Australian Open: local Jan 8 - Feb 1
    - cron: '37 21 1 2 *'      # Australian Open spillover: local Feb 2
    # Roland Garros - Paris, CEST (UTC+2). 08:37 local = 06:37 UTC.
    - cron: '37 6 18-31 5 *'   # French Open: May 18-31
    - cron: '37 6 1-10 6 *'    # French Open: Jun 1-10
    # Wimbledon - London, BST (UTC+1). 08:37 local = 07:37 UTC.
    - cron: '37 7 22-30 6 *'   # Wimbledon: Jun 22-30
    - cron: '37 7 1-15 7 *'    # Wimbledon: Jul 1-15
    # US Open - New York, EDT (UTC-4). 08:37 local = 12:37 UTC.
    - cron: '37 12 18-31 8 *'  # US Open: Aug 18-31
    - cron: '37 12 1-15 9 *'   # US Open: Sep 1-15
    # Combined ATP/WTA 1000s (forward test covers these too; windows padded
    # for year-to-year date drift, and Madrid-Rome runs into the French
    # window / Canada-Cincinnati into the US Open window for continuous
    # daily coverage across each swing). Same rule, each at its own venue.
    # Indian Wells - California. PST (UTC-8) until DST, PDT (UTC-7) after;
    # 15:37 UTC is 07:37 or 08:37 local, and comfortably before an 11am first
    # ball either way, so one entry covers the whole window.
    - cron: '37 15 1-20 3 *'   # Indian Wells: Mar 1-20
    # Miami - Florida, EDT (UTC-4).
    - cron: '37 12 21-31 3 *'  # Miami: Mar 21-31
    - cron: '37 12 1-6 4 *'    # Miami spillover: Apr 1-6
    # Madrid and Rome - CEST (UTC+2), same as Roland Garros.
    - cron: '37 6 20-30 4 *'   # Madrid: Apr 20-30
    - cron: '37 6 1-17 5 *'    # Madrid finish + Rome: May 1-17
    # Canada and Cincinnati - EDT (UTC-4), same as the US Open.
    - cron: '37 12 25-31 7 *'  # Canada: Jul 25-31
    - cron: '37 12 1-17 8 *'   # Canada finish + Cincinnati: Aug 1-17
    # Off-season heartbeat: Mondays year-round. Keeps the stats current with
    # non-slam tournaments (the summer hard-court swing feeds the US Open
    # model), re-prices the projected title odds, grows the season track
    # record, and lands the same day the weekly recap share card generates.
    # No venue to anchor to out of season, so it takes the Eastern hour.
    # On Mondays inside a slam window this fires alongside the daily cron;
    # the concurrency group below serializes the two, and the second run is
    # cheap (the fetch cache is under 24h old, so it skips every player).
    - cron: '37 12 * * 1'      # Off-season: every Monday

# The default GITHUB_TOKEN is read-only on contents unless explicitly
# elevated - without this, the final "git push" step fails with exit 1.
# issues: write lets the failure step below open an alert issue.
permissions:
  contents: write
  issues: write

# Never run two refreshes at once (e.g. a slam-window Monday triggers both
# crons, or a manual dispatch lands mid-run): queue instead of overlapping,
# so the commit/push step never races itself.
concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # --legacy-peer-deps: an unrelated optional peer (@sveltejs/kit, only
      # used by @vercel/analytics' Svelte integration, which this project
      # doesn't use) otherwise makes plain `npm ci` fail with an ERESOLVE
      # conflict - same issue hit installing locally.
      - run: npm ci --legacy-peer-deps

      # Persist the raw match-history caches (both tours) across runs.
      # data-pipeline/raw is gitignored - too big and churny for the repo -
      # so without this every run starts cold and re-downloads ~1,000 stat
      # pages from the API (the old 1.5-hour fetch phase). With it, the
      # incremental fetch pulls only what's new (1-2 pages per player) and
      # player history ACCUMULATES across runs instead of being rebuilt from
      # each player's newest-300 window. Cache keys are immutable, so each
      # run restores the most recent cache (restore-keys prefix match) and
      # saves an updated one under its own run id when the job succeeds.
      - name: Restore raw match-history cache
        uses: actions/cache@v4
        with:
          path: data-pipeline/raw
          key: raw-matches-${{ github.run_id }}
          restore-keys: |
            raw-matches-

      - name: Refresh stats (fetch + recompute + rebuild CSVs)
        run: npm run refresh-stats
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}

      - name: Rebuild upset-scenario CSVs
        run: npm run build-upset-csv
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}

      - name: Fetch any missing player headshots
        run: npm run fetch-images
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}

      - name: Refresh women's (WTA) stats (fetch + recompute + rebuild CSVs)
        run: npm run refresh-stats-women
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}

      - name: Rebuild women's upset-scenario CSVs
        run: npm run build-upset-csv-women
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}

      - name: Fetch any missing women's player headshots
        run: npm run fetch-images-women
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}

      # Surface Elo form ratings (both tours) - the live H2H blends these
      # with the point simulation.
      - name: Compute Elo form ratings
        run: npm run compute-elo

      # Odds snapshots for closing-line value: re-read the same upcoming-
      # matches endpoint the lock pass uses and append a snapshot for every
      # locked, still-pending call whose price moved. ~6 requests. Runs
      # BEFORE build-predictions so today's matches get a morning-of reading
      # ahead of any new locks. The dedicated odds-snapshots workflow adds
      # two afternoon readings closer to first serve.
      - name: Snapshot odds for locked pending calls
        continue-on-error: true
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: npm run fetch-odds-snapshots

      # Must run LAST - it re-simulates every completed 2026 match using the
      # freshly-rebuilt surface + upset CSVs and the newly-fetched match
      # caches (and replays Elo), so the Track Record page picks up new
      # results automatically.
      - name: Rebuild Track Record (precomputed predictions)
        run: npm run build-track-record

      # Immediately after, because these are figures the Parlay builder states
      # as fact about the record that was just rewritten. They were constants
      # once: the dedupe refresh moved every one of them, and the stale claim
      # sat on the live site until an unrelated PR happened to run the test.
      # The production build regenerates them anyway, so this is here to keep
      # the committed file honest and to put the change in the diff.
      - name: Re-derive the published market-gap figures
        run: npm run build-market-gap

      # Prior-season components for the rolling-window tuner (the retune
      # workflow reads this committed artifact - it has no raw data itself).
      - name: Build tuner history
        run: npm run build-tuner-history

      # Forward test: grade any locked predictions whose results have landed,
      # then lock new ones for upcoming matches.
      # continue-on-error: the script hard-crashes on a corrupt ledger BY
      # DESIGN (never silently restart the locked forward record) - but that
      # protection shouldn't discard the whole day's stats/track-record
      # refresh with it. The alert step after the commit names this step
      # when it fails.
      - name: Update forward predictions
        id: predictions
        continue-on-error: true
        env:
          # For lock-time market odds on pending picks (~4-6 requests/run);
          # without the key the step still locks predictions, just unpriced.
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: npm run build-predictions

      # Model guardrails: per tour x surface, compare the deployed engine's
      # recent accuracy against the season, the rankings baseline, and a coin
      # flip. Writes public/data/guardrails.json; a later step opens an alert
      # issue if anything tripped.
      # After-refresh API usage report: session calls, month cumulative,
      # remaining, and $ - rendered on this run's summary page. always() so
      # the numbers show even when a later step fails.
      - name: Report API usage
        if: always()
        continue-on-error: true
        run: npm run report-api-usage

      # API spend guardrail: if any fetcher hard-stopped (quota reserve floor
      # or per-run cap - see data-pipeline/lib/apiBudget.js), open/refresh an
      # issue and clear the marker so the cached copy can't re-alert forever.
      # The run itself continues: a throttled refresh on cached data is the
      # designed behavior, not a failure.
      - name: Alert if the API spend guardrail tripped
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MARKER="data-pipeline/raw/api-budget-alert.json"
          if [ ! -f "$MARKER" ]; then echo "Spend guardrail clean."; exit 0; fi
          TITLE="API spend guardrail tripped"
          BODY="A fetcher hit the spend hard-stop on $(date -u +%Y-%m-%d) and switched to cached data (no overage risk). Details: $(cat "$MARKER"). Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          rm -f "$MARKER"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number' --repo "${{ github.repository }}")
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY" --repo "${{ github.repository }}"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label bug --repo "${{ github.repository }}" || \
            gh issue create --title "$TITLE" --body "$BODY" --repo "${{ github.repository }}"
          fi

      - name: Check model guardrails
        run: npm run check-guardrails

      # Sitemap + robots: enumerate every match and player page for crawlers.
      # Runs after build-predictions so new match pages are included.
      - name: Build sitemap
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: npm run build-sitemap

      # Email digest, every run. The script picks its own edition: the weekly
      # recap on Mondays (UTC), the short daily otherwise - so this lands
      # daily through the tournament windows and weekly off-season, matching
      # the crons above without duplicating that logic here.
      #
      # Send is optional but NOT silent: without RESEND_API_KEY (or with no
      # recipients) the step writes the files and logs a loud warning saying
      # no mail went out. That combination is why the digest appeared to work
      # for months while never actually mailing anyone.
      # Cadence: this step runs on every refresh, but the digest only MAILS
      # when the refresh actually refreshed something. buildDigest checks two
      # things before sending - whether the results feed has moved, and
      # whether a fetcher tripped the API spend guard on this run - and skips
      # the send if either says the data is stale, writing the files anyway.
      #
      # That matters because the workflow completing is not the same as the
      # data being current: when the budget guard trips, every fetcher serves
      # the cache and this job still succeeds. Without the check, subscribers
      # got the same card every morning for the length of the outage.
      - name: Build and send the email digest
        continue-on-error: true
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          # Manual dispatch can build without mailing. Gated on the event name
          # as well as the input because `inputs` is empty on a scheduled run,
          # and an empty value compares equal to false - so testing the input
          # alone would silently dry-run every cron and quietly stop the
          # digest forever, which is the exact failure this file already
          # carries a comment about further down.
          DIGEST_DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.send_digest == false) && '1' || '' }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          # Transport A: Gmail SMTP. Needs no domain, so this is the one that
          # works before you own one. GMAIL_APP_PASSWORD is a Google App
          # Password (requires 2-Step Verification on that account).
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # Transport B: Resend. Used only when Gmail is not configured, and
          # DIGEST_FROM must be on a domain verified in Resend.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
          # Subscriber list (digest_subscribers is readable only by the
          # service key: the table allows anon INSERT but no anon SELECT)
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: npm run build-digest

      # The four generators below are presentation layers over data that is
      # already computed. continue-on-error on each: a sharp/ffmpeg crash in
      # a card render must not discard the whole successful refresh sitting
      # uncommitted behind it (yesterday's cosmetic files simply persist).
      # The alert step after the commit still opens an issue when any of
      # them failed, so nothing rots silently.

      # Championship odds: simulate the live slam draw to completion and
      # append today's snapshot to the odds history.
      - name: Compute championship title odds
        id: title_odds
        continue-on-error: true
        run: npm run build-title-odds

      # The day's shareable artifact: yesterday's scorecard + upset watch.
      - name: Build the daily scorecard
        id: scorecard
        continue-on-error: true
        run: npm run build-daily-scorecard

      # Season rewind: the /season page's JSON (archives last year's file
      # automatically on the first run of a new year).
      - name: Build the season rewind
        id: season_rewind
        continue-on-error: true
        run: npm run build-season-rewind

      # The share kit: Instagram-format prediction cards (carousel + story)
      # in public/data/share/, each with a ready caption in manifest.json.
      # sharp is installed here rather than kept in package.json (a local
      # file lock prevents committing it as a dependency). Fonts: the cards
      # want a condensed display face; fonts-dejavu-extra ships DejaVu Sans
      # Condensed (already in the generator's font chain) and actually
      # exists in the Ubuntu archive - the old fonts-barlow attempt failed
      # silently for months and every card rendered in wide DejaVu Sans.
      # The generator sizes text width-safely either way; the install is
      # logged, not silenced, so a regression is visible in the run log.
      - name: Generate shareable assets
        id: share_assets
        continue-on-error: true
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y --no-install-recommends fonts-dejavu-extra || echo "WARNING: fonts-dejavu-extra install failed; cards fall back to wide DejaVu Sans"
          sudo apt-get install -y --no-install-recommends fonts-barlow 2> /dev/null || echo "fonts-barlow unavailable (expected); using DejaVu Sans Condensed"
          fc-list | grep -i -E 'barlow|condensed' || echo "WARNING: no condensed font registered"
          npm install --no-save sharp
          npm run build-share-assets

      # Animated assets (title-odds race, countdown) - ffmpeg ships on the
      # runner. Skips itself when there's nothing to animate.
      - name: Generate motion assets
        id: motion_assets
        continue-on-error: true
        run: npm run build-motion-assets

      # The full run takes a while; if main moved in the meantime (a normal
      # push during a slam), a plain push is rejected as non-fast-forward.
      # Rebase our single data commit on top of the new head, retrying once
      # in case of a push race.
      - name: Commit refreshed data
        run: |
          git config user.name "smash-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data public/sitemap.xml public/robots.txt data-pipeline/output src/assets/players src/assets/players-women src/data/marketGap.json
          git diff --cached --quiet && exit 0
          git commit -m "Automated data refresh"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "Push attempt $attempt failed; retrying..."
            sleep 15
          done
          echo "Could not push after 3 attempts" >&2
          exit 1

      # Image-centric autopost: hands the day's best share cards (cover,
      # results, moments) to a Buffer/Zapier/Make-style webhook. Runs AFTER
      # the commit so the posted imageUrls are live once Vercel deploys.
      # Without the secret it dry-runs and no-ops.
      - name: Post share cards to autopost webhook (optional)
        continue-on-error: true
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          AUTOPOST_WEBHOOK_URL: ${{ secrets.AUTOPOST_WEBHOOK_URL }}
        run: npm run post-social

      # Upset-alert web push (optional): at most one notification per run,
      # only for a graded upset we called or a fresh bold underdog call.
      # Without the VAPID/Supabase secrets it logs and no-ops.
      - name: Send upset-alert web push (optional)
        continue-on-error: true
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          npm install --no-save web-push > /dev/null 2>&1
          npm run send-push

      # Optional publicity: if a SOCIAL_WEBHOOK_URL secret is configured (a
      # Slack/Discord/Zapier-style JSON webhook), post the day's scorecard
      # text after a successful refresh. With no secret the step is a no-op,
      # so nothing is ever published unless you explicitly wire it up.
      - name: Post daily scorecard to webhook (optional)
        env:
          WEBHOOK: ${{ secrets.SOCIAL_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "No SOCIAL_WEBHOOK_URL configured; skipping."; exit 0; fi
          # text/content: the scorecard one-liner (Slack/Discord render those
          # keys directly). thread: the ready-to-paste slate thread from the
          # share manifest, for consumers that publish multi-post threads.
          PAYLOAD=$(node -e "
            const sc = require('./public/data/daily_scorecard.json');
            let thread = null;
            try { thread = require('./public/data/share/manifest.json').thread || null; } catch {}
            console.log(JSON.stringify({ text: sc.postText, content: sc.postText, thread }));
          ")
          curl -s -X POST -H 'Content-Type: application/json' \
            -d "$PAYLOAD" "$WEBHOOK" || echo "Webhook post failed (non-fatal)."

      # Model quality alert: if any guardrail tripped (a tour x surface cell
      # or the forward test going cold), open an issue so it gets seen. Same
      # dedupe pattern as the failure alert below - one open issue collects
      # daily updates instead of piling up duplicates.
      - name: Open an issue if a model guardrail tripped
        # Alerting is best-effort: a gh API blip after a successful refresh
        # must not mark the whole (already pushed) run as failed.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ALERTS=$(node -e "try { const g = require('./public/data/guardrails.json'); console.log((g.alerts || []).join('\n')); } catch {}")
          if [ -z "$ALERTS" ]; then echo "All model guardrails green."; exit 0; fi
          TITLE="Model guardrail alert"
          BODY="One or more accuracy guardrails tripped on $(date -u +%Y-%m-%d):

          $ALERTS

          Details: public/data/guardrails.json in the latest data commit. Run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number' --repo "${{ github.repository }}")
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY" --repo "${{ github.repository }}"
          else
            gh issue create --title "$TITLE" --body "$BODY" --repo "${{ github.repository }}"
          fi

      # The cosmetic generators are continue-on-error so a card-render crash
      # can't discard the data commit - but their failures still surface here.
      - name: Open an issue if a cosmetic generator failed
        if: steps.predictions.outcome == 'failure' || steps.title_odds.outcome == 'failure' || steps.scorecard.outcome == 'failure' || steps.season_rewind.outcome == 'failure' || steps.share_assets.outcome == 'failure' || steps.motion_assets.outcome == 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Cosmetic generator failed in data refresh"
          BODY="The data refresh committed fine, but a fault-isolated step failed on $(date -u +%Y-%m-%d): predictions=${{ steps.predictions.outcome }}, title_odds=${{ steps.title_odds.outcome }}, scorecard=${{ steps.scorecard.outcome }}, season_rewind=${{ steps.season_rewind.outcome }}, share_assets=${{ steps.share_assets.outcome }}, motion_assets=${{ steps.motion_assets.outcome }}. See the run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number' --repo "${{ github.repository }}")
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY" --repo "${{ github.repository }}"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label bug --repo "${{ github.repository }}" || \
            gh issue create --title "$TITLE" --body "$BODY" --repo "${{ github.repository }}"
          fi

      # Fail loudly and privately: a broken refresh during a slam should open
      # an issue (which GitHub emails to watchers), never rot silently while
      # the site serves stale data. Reuses an existing open alert instead of
      # piling up duplicates when a failure repeats daily.
      - name: Open an issue if the refresh failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Data refresh failed"
          BODY="The scheduled/manual data refresh failed on $(date -u +%Y-%m-%d). See the run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number' --repo "${{ github.repository }}")
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY" --repo "${{ github.repository }}"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label bug --repo "${{ github.repository }}" || \
            gh issue create --title "$TITLE" --body "$BODY" --repo "${{ github.repository }}"
          fi
