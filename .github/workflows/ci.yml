name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint (same rule set the CRA builds enforced)
        run: npm run lint

      - name: Unit tests (simulator math, engines, credible intervals)
        run: npm test

      # Every data-pipeline test, not just lib/. These are node:test files, so
      # `npm test` (vitest) does not pick them up, and for a long time this step
      # only globbed lib/ - which meant the rating-core tests and the
      # prediction-voiding tests gated nothing. They ran only on a manual
      # dispatch of verify-ratings.yml, where a missing dependency in a test's
      # require chain sat undetected until someone happened to run it.
      - name: Pipeline tests (rating cores, voiding, ESPN schedule matching)
        run: node --test data-pipeline/*.test.js data-pipeline/lib/*.test.js

      - name: Production build (vite)
        run: npm run build

      - name: E2E smoke tests (five key pages against the real bundle)
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
